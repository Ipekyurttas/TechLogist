services:
  db:
    image: postgres:16
    container_name: techlogist_db
    environment:
      POSTGRES_DB: techlogist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 46205ipek
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: techlogist_app
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/techlogist
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=46205ipek
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update