services:
  jenkins:
    image: jenkins-full
    container_name: jenkins-blueocean
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - testnet

  app:
    build: .
    container_name: techlogist-app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:techlogist;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/login"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - testnet

networks:
  testnet:

volumes:
  jenkins_home:
